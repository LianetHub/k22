<header class="header">

        <div class="header__banner-container container">

                <div class="header__actions">

                    <button type="button" class="header__burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="site-menu" data-menu-burger>
                        <span class="header__burger-line"></span>
