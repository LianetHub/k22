<section class="gallery@@if(typeof mod !== 'undefined'){ @@mod}">
	<div class="gallery__container container">
		<h2 class="gallery__title title">
			@@if(typeof title !== 'undefined'){@@title}
			@@if(typeof title === 'undefined'){Фотогаллерея}
		</h2>
		@@if(typeof galleryList !== 'undefined') {
		<div class="gallery__slider swiper">
			<div class="swiper-wrapper">
				@@loop('../templates/_gallery-slide.html', '@@galleryList')
			</div>
		</div>
		}
	</div>
</section>
