<section class="reviews@@if(typeof mod !== 'undefined'){ @@mod}">
	<div class="reviews__container container">
		<h2 class="reviews__title title decor-line-block">Отзывы</h2>
		@@if(typeof reviewsList !== 'undefined') {
		<div class="reviews__slider swiper">
			<div class="reviews__grid swiper-wrapper">
				@@loop('../templates/_review-card.html', '@@reviewsList')
			</div>
		</div>
		}
		@@if(typeof moreHref !== 'undefined') {
		<a class="reviews__more more-link" href="@@moreHref">Читать все отзывы</a>
		}
		@@if(typeof moreHref === 'undefined') {
		<a class="reviews__more more-link" href="#">Читать все отзывы</a>
		}
		<div class="reviews__nav">
			<button type="button" class="reviews__prev swiper-button-prev icon-prev" aria-label="Предыдущий отзыв"></button>
			<button type="button" class="reviews__next swiper-button-next icon-next" aria-label="Следующий отзыв"></button>
		</div>
	</div>
</section>
