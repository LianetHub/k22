<section class="contacts">
	<div class="contacts__container container">
		<div class="contacts__intro">
			<h2 class="contacts__title title decor-line-block">НАши сервисы</h2>
			<p class="contacts__subtitle">Два сервисных центра в Санкт-Петербурге. Выберите удобный для вас адрес</p>
		</div>

		<div class="contacts__map-block">
			<div
				class="contacts__map"
				id="contacts-map"
				data-zoom="12"
				data-icon="@img/placemark.svg"
				data-apikey=""
				data-markers="59.8689,30.3675|Кузнецовская, 52к13;59.8336,30.3758|Лужская, 3к2б"
			></div>

			<div class="contacts__panel">
				<div class="contacts__place">
					<h3 class="contacts__place-title">Кузнецовская, 52к13</h3>
					<div class="contacts__phone-row">
						<a href="tel:+79214019898" class="contacts__phone-icon icon-phone" aria-label="Позвонить"></a>
						<div class="contacts__phone-info">
							<a href="tel:+79214019898" class="contacts__phone">8(921)401-98-98</a>
							<p class="contacts__hours">пн-сб с 10:00 до 20:00</p>
						</div>
					</div>
					<div class="contacts__route">
						<span class="contacts__route-label">Построить маршрут</span>
						<a
							class="contacts__route-app"
							href="https://yandex.ru/maps/?rtext=~59.8689,30.3675"
							target="_blank"
							rel="noopener noreferrer"
							aria-label="Маршрут в Яндекс.Картах"
						>
							<img src="@img/contacts/yandex-navi.svg" alt="Яндекс.Навигатор" width="30" height="30" loading="lazy">
						</a>
						<a
							class="contacts__route-app contacts__route-app--plain"
							href="https://2gis.ru/spb/search/%D0%9A%D1%83%D0%B7%D0%BD%D0%B5%D1%86%D0%BE%D0%B2%D1%81%D0%BA%D0%B0%D1%8F%2052%D0%BA13"
							target="_blank"
							rel="noopener noreferrer"
							aria-label="Маршрут в 2ГИС"
						>
							<img src="@img/contacts/2gis.svg" alt="2ГИС" width="40" height="40" loading="lazy">
						</a>
						<a
							class="contacts__route-app"
							href="https://www.google.com/maps/dir/?api=1&destination=59.8689,30.3675"
							target="_blank"
							rel="noopener noreferrer"
							aria-label="Маршрут в Google Maps"
						>
							<img src="@img/contacts/google-maps.svg" alt="Google Maps" width="30" height="30" loading="lazy">
						</a>
					</div>
				</div>

				<div class="contacts__brand">
					<div class="contacts__brand-lines" aria-hidden="true"></div>
					<img
						class="contacts__brand-logo"
						src="@img/contacts/logo.svg"
						alt="K22 Powerteam"
						width="284"
						height="125"
						loading="lazy"
					>
					<div class="contacts__brand-lines contacts__brand-lines--flip" aria-hidden="true"></div>
				</div>

				<div class="contacts__place contacts__place--end">
					<h3 class="contacts__place-title">Лужская, 3к2б</h3>
					<div class="contacts__phone-row">
						<div class="contacts__phone-info">
							<a href="tel:+79214019898" class="contacts__phone">8(921)401-98-98</a>
							<p class="contacts__hours">пн-сб с 10:00 до 20:00</p>
						</div>
						<a href="tel:+79214019898" class="contacts__phone-icon icon-phone" aria-label="Позвонить"></a>
					</div>
					<div class="contacts__route">
						<span class="contacts__route-label">Построить маршрут</span>
						<a
							class="contacts__route-app"
							href="https://yandex.ru/maps/?rtext=~59.8336,30.3758"
							target="_blank"
							rel="noopener noreferrer"
							aria-label="Маршрут в Яндекс.Картах"
						>
							<img src="@img/contacts/yandex-navi.svg" alt="Яндекс.Навигатор" width="30" height="30" loading="lazy">
						</a>
						<a
							class="contacts__route-app contacts__route-app--plain"
							href="https://2gis.ru/spb/search/%D0%9B%D1%83%D0%B6%D1%81%D0%BA%D0%B0%D1%8F%203%D0%BA2%D0%B1"
							target="_blank"
							rel="noopener noreferrer"
							aria-label="Маршрут в 2ГИС"
						>
							<img src="@img/contacts/2gis.svg" alt="2ГИС" width="40" height="40" loading="lazy">
						</a>
						<a
							class="contacts__route-app"
							href="https://www.google.com/maps/dir/?api=1&destination=59.8336,30.3758"
							target="_blank"
							rel="noopener noreferrer"
							aria-label="Маршрут в Google Maps"
						>
							<img src="@img/contacts/google-maps.svg" alt="Google Maps" width="30" height="30" loading="lazy">
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
