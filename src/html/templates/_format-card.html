<li class="format__card">
	<a href="" class="format__card-wrapper">
		<span class="format__media">
			<img class="format__image" src="@@image" srcset="@@image 1024w" sizes="(min-width: 992px) 50vw, 100vw" alt="@@alt" width="1024" height="683" loading="lazy">
		</span>
		<span class="format__body">
			<span class="format__name">@@title</span>
			<span class="format__text">@@text</span>
		</span>
	</a>
</li>
