<article class="feature-card @@cardMod" style="background-image: url('@@image');">
	<div class="feature-card__notch">
		<div class="feature-card__badge">
			<span class="feature-card__icon icon-@@icon" aria-hidden="true"></span>
		</div>
		<div class="feature-card__cut" aria-hidden="true"></div>
	</div>
	<div class="feature-card__body">
		<h3 class="feature-card__title">@@title</h3>
		<p class="feature-card__text">@@text</p>
	</div>
</article>
