<li class="catalog-cats__item">
	<a class="catalog-cats__card" href="@@href">
		<h3 class="catalog-cats__title">@@title</h3>
		@@if (typeof lead !== 'undefined') {
		<p class="catalog-cats__lead">@@lead</p>
		}
		<span class="catalog-cats__more">@@link</span>
		<img class="catalog-cats__image" src="@@image" alt="@@imageAlt" width="219" height="154" loading="lazy">
	</a>
</li>
