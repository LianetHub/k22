<article class="offer @@mod" style="background-image: url('@@image');">
	<span class="offer__badge">@@badge</span>
	<div class="offer__content">
		<h3 class="offer__title">@@title</h3>
		<p class="offer__text">@@text</p>
	</div>
	<a class="btn btn--primary offer__btn" href="@@href">Перейти</a>
</article>
