<li>
	<a class="article__aside-card" href="@@href">
		<span class="article__aside-media">
			<img src="@@image" alt="@@imageAlt" width="237" height="180"@@if(typeof loading !== 'undefined'){ loading="@@loading"}>
		</span>
		<span class="article__aside-body">
			<span class="article__aside-date">
				<img src="@img/icons/calendar.svg" alt="Дата" width="14" height="14">
				<span>@@date</span>
			</span>
			<span class="article__aside-title">@@title</span>
			<span class="article__badge">@@badge</span>
		</span>
	</a>
</li>
