<div class="swiper-slide">
	<article class="review-card">
		<div class="review-card__body">
			<div class="review-card__man">
				<div class="review-card__avatar icon-user" aria-hidden="true"></div>
				<div class="review-card__identity">
					<h3 class="review-card__name">@@name</h3>
					<p class="review-card__car">@@car</p>
				</div>
				<div class="review-card__stars" aria-label="Оценка 5 из 5">
					<span class="review-card__star icon-star" aria-hidden="true"></span>
					<span class="review-card__star icon-star" aria-hidden="true"></span>
					<span class="review-card__star icon-star" aria-hidden="true"></span>
					<span class="review-card__star icon-star" aria-hidden="true"></span>
					<span class="review-card__star icon-star" aria-hidden="true"></span>
				</div>
			</div>
			<div class="review-card__text">@@text</div>
		</div>
		<div class="review-card__foot">
			<div class="review-card__cut" aria-hidden="true"></div>
			<div class="review-card__address icon-locations">@@address</div>
		</div>
	</article>
</div>
