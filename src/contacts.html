<!DOCTYPE html>
<html lang="ru">
	@@include('html/_head.html', {
	"title": "K22 | Контакты"
	})
	<body>
		<div class="wrapper">
			@@include('html/_header.html')
			<main class="page">
				<section class="contacts contacts--page">
					<div class="contacts__container container">
						<h1 class="contacts__title title decor-line-block">Контакты</h1>

						<div class="contacts__map-block">
							<div class="contacts__panel">
								<div class="contacts__cities" role="tablist" aria-label="Город">
									<button type="button" class="contacts__city is-active" aria-selected="true">Санкт-Петербург</button>
									<button type="button" class="contacts__city" aria-selected="false">Барнаул</button>
								</div>

								<div class="contacts__addresses">
									<div class="contacts__address contacts__address--active">
										<p class="contacts__address-title">Кузнецовская, 52к13</p>
										<div class="contacts__route">
											<a class="contacts__route-app" href="https://yandex.ru/maps/?rtext=~59.8689,30.3675" target="_blank" rel="noopener noreferrer" aria-label="Маршрут в Яндекс.Картах">
												<img src="@img/contacts/yandex-navi.svg" alt="Яндекс.Навигатор" width="30" height="30" loading="lazy">
											</a>
											<a class="contacts__route-app contacts__route-app--plain" href="https://2gis.ru/spb/search/%D0%9A%D1%83%D0%B7%D0%BD%D0%B5%D1%86%D0%BE%D0%B2%D1%81%D0%BA%D0%B0%D1%8F%2052%D0%BA13" target="_blank" rel="noopener noreferrer" aria-label="Маршрут в 2ГИС">
												<img src="@img/contacts/2gis.svg" alt="2ГИС" width="40" height="40" loading="lazy">
											</a>
											<a class="contacts__route-app" href="https://www.google.com/maps/dir/?api=1&destination=59.8689,30.3675" target="_blank" rel="noopener noreferrer" aria-label="Маршрут в Google Maps">
												<img src="@img/contacts/google-maps.svg" alt="Google Maps" width="30" height="30" loading="lazy">
											</a>
										</div>
									</div>

									<div class="contacts__address">
										<p class="contacts__address-title">Лужская, 3к2б</p>
										<div class="contacts__route">
											<a class="contacts__route-app" href="https://yandex.ru/maps/?rtext=~59.8336,30.3758" target="_blank" rel="noopener noreferrer" aria-label="Маршрут в Яндекс.Картах">
												<img src="@img/contacts/yandex-navi.svg" alt="Яндекс.Навигатор" width="30" height="30" loading="lazy">
											</a>
											<a class="contacts__route-app contacts__route-app--plain" href="https://2gis.ru/spb/search/%D0%9B%D1%83%D0%B6%D1%81%D0%BA%D0%B0%D1%8F%203%D0%BA2%D0%B1" target="_blank" rel="noopener noreferrer" aria-label="Маршрут в 2ГИС">
												<img src="@img/contacts/2gis.svg" alt="2ГИС" width="40" height="40" loading="lazy">
											</a>
											<a class="contacts__route-app" href="https://www.google.com/maps/dir/?api=1&destination=59.8336,30.3758" target="_blank" rel="noopener noreferrer" aria-label="Маршрут в Google Maps">
												<img src="@img/contacts/google-maps.svg" alt="Google Maps" width="30" height="30" loading="lazy">
											</a>
										</div>
									</div>
								</div>

								<div class="contacts__divider" aria-hidden="true"></div>

								<div class="contacts__bottom">
									<div class="contacts__phone-row">
										<a href="tel:+79214019898" class="contacts__phone-icon icon-phone" aria-label="Позвонить"></a>
										<div class="contacts__phone-info">
											<a href="tel:+79214019898" class="contacts__phone">8(921)401-98-98</a>
											<p class="contacts__hours">пн-сб с 10:00 до 20:00</p>
										</div>
									</div>

									<div class="contacts__socials">
										<a href="#" class="contacts__social social-item icon-max" aria-label="Max"></a>
										<a href="#" class="contacts__social social-item icon-telegram" aria-label="Telegram"></a>
										<a href="#" class="contacts__social social-item icon-vk" aria-label="VK"></a>
										<a href="#" class="contacts__social social-item icon-whatsapp" aria-label="WhatsApp"></a>
									</div>
								</div>
							</div>

							<div
								class="contacts__map"
								id="contacts-map"
								data-zoom="12"
								data-icon="@img/placemark.svg"
								data-apikey=""
								data-markers="59.8689,30.3675|Кузнецовская, 52к13;59.8336,30.3758|Лужская, 3к2б"></div>
						</div>
					</div>
				</section>
			</main>
			@@include('html/_footer.html', {})
		</div>
		@@include('html/_js.html', {})
	</body>
</html>
